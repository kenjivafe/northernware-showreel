<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coastline Resort · Book direct</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#F4F6FA;color:#14213D;-webkit-font-smoothing:antialiased;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:#fff;font-weight:800;font-size:19px;letter-spacing:-.02em}
.top span{font-size:13px;font-weight:600;color:#3b5bdb}
.ph{height:250px;background:url(../img/cl-hero.jpg) center/cover}
.card{background:#fff;margin:-30px 14px 0;border-radius:20px;padding:18px;position:relative;box-shadow:0 14px 30px -18px rgba(20,33,61,.4)}
.card h1{font-size:22px;letter-spacing:-.02em}
.card p{color:#5c6b8a;font-size:14px;margin-top:4px}
.fl{display:flex;gap:8px;margin:16px 0}
.fl div{flex:1;border:1px solid #E1E6F0;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:700}
.fl small{display:block;font-size:10.5px;color:#7a88a6;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.go{height:52px;border-radius:14px;background:#3b5bdb;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
.ok{position:absolute;inset:0;background:#fff;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
.ok i{width:62px;height:62px;border-radius:50%;background:#2f9e44;display:grid;place-items:center;margin-bottom:10px}
.ok b{font-size:22px}.ok span{color:#5c6b8a;font-size:14px;margin-top:4px}
</style></head>
<body>
<div class="top">Coastline Resort<span>Book direct</span></div>
<div class="ph"></div>
<div class="card"><h1>Ocean View Room</h1><p>Free cancellation &#183; instant confirmation</p>
  <div class="fl"><div><small>Dates</small>Sat 18 &#8211; Sun 19</div><div><small>Guests</small>2 adults</div></div>
  <div class="go" id="cbook">Book now &#183; &#8369;5,200</div>
  <div class="ok" id="ok"><i><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></i><b>Booked!</b><span>Coastline Resort &#183; Sat 18 &#8211; Sun 19</span></div></div>
<script src="../sc.js"></script>
<script>
window.act = (s) => { if (s.live) return; document.getElementById('ok').style.opacity = s.done || 0; document.getElementById('cbook').style.transform = `scale(${1 - 0.04 * (s.press || 0)})`; };
if (VIDEO) SC.set({});
</script>
</body></html>
